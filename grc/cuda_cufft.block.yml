id: cuda_cufft
label: cufft
category: '[cuda]'

templates:
  imports: from gnuradio import cuda
  make: cuda.cufft(${fft_num}, ${len_key}, ${forward}, ${win_type})

#  Make one 'parameters' list entry for every parameter you want settable from the GUI.
#     Keys include:
#     * id (makes the value accessible as keyname, e.g. in the make entry)
#     * label (label shown in the GUI)
#     * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#     * default
parameters:
- id: fft_num
  label: FFT_NUM
  dtype: int
  default: 1024
- id: len_key
  label: Packet length key
  dtype: string
  default: '"packet_len"'
- id: forward
  label: Do FFT or IFFT
  dtype: enum
  options: ["True", "False"]
  option_labels: [Foward, Reverse]
- id: win_type
  label: Window type
  dtype: enum
  options: ['"Rectangle"', '"Hamming"', '"Hanning"', '"Blackman"']
  option_labels: [Rectangle, Hamming, Hanning, Blackman]
#- id: ...
#  label: ...
#  dtype: ...

#  Make one 'inputs' list entry per input and one 'outputs' list entry per output.
#  Keys include:
#      * label (an identifier for the GUI)
#      * domain (optional - stream or message. Default is stream)
#      * dtype (e.g. int, float, complex, byte, short, xxx_vector, ...)
#      * vlen (optional - data stream vector length. Default is 1)
#      * optional (optional - set to 1 for optional inputs. Default is 0)
inputs:
-   label: IQ in
    domain: stream
    dtype: complex
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

outputs:
-   label: IQ out
    domain: stream
    dtype: complex
#- label: ...
#  domain: ...
#  dtype: ...
#  vlen: ...
#  optional: ...

#  'file_format' specifies the version of the GRC yml format used in the file
#  and should usually not be changed.
file_format: 1
